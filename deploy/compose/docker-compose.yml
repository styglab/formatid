# Generated by scripts/generate_compose.py
# Source of truth: services/*/manifests + apps/**/manifests
name: infra
services:
  embedding-service:
    build:
      context: ../..
      dockerfile: services/embedding/infra/image/Dockerfile
    restart: unless-stopped
    env_file:
      - ../../services/embedding/infra/env/app.env
    ports:
      - "${HOST_BIND_IP:-127.0.0.1}:${EMBEDDING_SERVICE_HOST_PORT:-8020}:8000"
    profiles:
      - "semantic_platform"
      - "pubdata"
    volumes:
      - ${EMBEDDING_MODELS_DIR:-../../data/models/embeddings}:/data/models/embeddings:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=5).read()"]
      interval: 10s
      timeout: 6s
      retries: 20

  nginx:
    build:
      context: ../..
      dockerfile: services/nginx/infra/image/Dockerfile
    restart: unless-stopped
    ports:
      - "${NGINX_HOST_PORT:-8081}:80"
    depends_on:
      platform-api:
        condition: service_healthy
      platform-dashboard:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/health/ready"]
      interval: 10s
      timeout: 3s
      retries: 5

  platform-api:
    build:
      context: ../..
      dockerfile: services/platform_api/infra/image/Dockerfile
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    restart: unless-stopped
    env_file:
      - ./env/postgres.env
      - ./env/platform_api.env
    ports:
      - "${HOST_BIND_IP:-127.0.0.1}:${API_HOST_PORT:-8000}:${API_CONTAINER_PORT:-8000}"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/live', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 10

  platform-dashboard:
    build:
      context: ../..
      dockerfile: services/platform_dashboard/infra/image/Dockerfile
    restart: unless-stopped
    ports:
      - "${HOST_BIND_IP:-127.0.0.1}:${DASHBOARD_HOST_PORT:-3001}:${DASHBOARD_CONTAINER_PORT:-80}"
    depends_on:
      platform-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 10s
      timeout: 3s
      retries: 5

  postgres:
    image: pgvector/pgvector:pg16
    command: ["postgres", "-c", "timezone=Asia/Seoul"]
    restart: unless-stopped
    env_file:
      - ./env/postgres.env
    ports:
      - "${POSTGRES_HOST_BIND_IP:-127.0.0.1}:${POSTGRES_HOST_PORT:-5433}:${POSTGRES_CONTAINER_PORT:-5432}"
    volumes:
      - ${POSTGRES_DATA_DIR:-../../data/postgres}:/var/lib/postgresql/data
      - ../../services/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 2s
      timeout: 2s
      retries: 10

  prefect-postgres:
    image: postgres:14
    restart: unless-stopped
    env_file:
      - ./env/prefect.env
    profiles:
      - "g2b-pipeline"
      - "g2b"
      - "semantic_platform"
      - "pubdata"
    volumes:
      - ${PREFECT_POSTGRES_DATA_DIR:-../../data/prefect/postgres}:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U prefect"]
      interval: 5s
      timeout: 5s
      retries: 5

  prefect-redis:
    image: redis:7
    restart: unless-stopped
    profiles:
      - "g2b-pipeline"
      - "g2b"
      - "semantic_platform"
      - "pubdata"
    volumes:
      - ${PREFECT_REDIS_DATA_DIR:-../../data/prefect/redis}:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  prefect-server:
    image: prefecthq/prefect:3-latest
    command: ["prefect", "server", "start", "--no-services"]
    restart: unless-stopped
    env_file:
      - ./env/prefect.env
    ports:
      - "${HOST_BIND_IP:-127.0.0.1}:${PREFECT_HOST_PORT:-4200}:4200"
    profiles:
      - "g2b-pipeline"
      - "g2b"
      - "semantic_platform"
      - "pubdata"
    depends_on:
      prefect-postgres:
        condition: service_healthy
      prefect-redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:4200/api/health', timeout=1)"]
      interval: 30s
      timeout: 10s
      retries: 3

  prefect-services:
    image: prefecthq/prefect:3-latest
    command: ["prefect", "server", "services", "start"]
    restart: unless-stopped
    env_file:
      - ./env/prefect.env
    profiles:
      - "g2b-pipeline"
      - "g2b"
      - "semantic_platform"
      - "pubdata"
    depends_on:
      prefect-server:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]
    ports:
      - "${HOST_BIND_IP:-127.0.0.1}:${REDIS_HOST_PORT:-6380}:${REDIS_CONTAINER_PORT:-6379}"
    volumes:
      - ../../services/redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 10

  semantic-platform-api:
    build:
      context: ../..
      dockerfile: services/semantic_platform/api/infra/image/Dockerfile
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    restart: unless-stopped
    env_file:
      - ../../services/semantic_platform/api/infra/env/app.env
    ports:
      - "${HOST_BIND_IP:-127.0.0.1}:${SEMANTIC_PLATFORM_API_HOST_PORT:-8016}:8000"
    profiles:
      - "semantic_platform"
      - "pubdata"
    depends_on:
      embedding-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready', timeout=2).read()"]
      interval: 10s
      timeout: 3s
      retries: 5

  semantic-platform-dashboard:
    build:
      context: ../..
      dockerfile: services/semantic_platform/dashboard/infra/image/Dockerfile
    restart: unless-stopped
    ports:
      - "${HOST_BIND_IP:-127.0.0.1}:${SEMANTIC_PLATFORM_DASHBOARD_HOST_PORT:-3016}:80"
    profiles:
      - "semantic_platform"
      - "pubdata"
    depends_on:
      semantic-platform-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 10s
      timeout: 3s
      retries: 5

  semantic-platform-worker:
    build:
      context: ../..
      dockerfile: services/semantic_platform/worker/infra/image/Dockerfile
    command: ["sh", "-c", "prefect work-pool inspect $$PREFECT_WORK_POOL >/dev/null 2>&1 || prefect work-pool create $$PREFECT_WORK_POOL --type process; python -m services.semantic_platform.worker.deployments; prefect worker start --pool $$PREFECT_WORK_POOL"]
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    restart: unless-stopped
    env_file:
      - ../../services/semantic_platform/worker/infra/env/app.env
    profiles:
      - "semantic_platform"
      - "pubdata"
    volumes:
      - ../../sources:/app/sources
    depends_on:
      embedding-service:
        condition: service_healthy
      prefect-server:
        condition: service_healthy

  g2b-mcp:
    build:
      context: ../..
      dockerfile: apps/g2b/mcp/infra/image/Dockerfile
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    restart: unless-stopped
    env_file:
      - ../../apps/g2b/mcp/infra/env/app.env
    ports:
      - "${HOST_BIND_IP:-127.0.0.1}:${G2B_MCP_HOST_PORT:-8013}:8000"
    profiles:
      - "g2b-mcp"
      - "g2b"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready', timeout=2).read()"]
      interval: 10s
      timeout: 3s
      retries: 5

  g2b-pipeline-worker:
    build:
      context: ../..
      dockerfile: apps/g2b/pipeline/infra/image/Dockerfile
    command: ["sh", "-c", "prefect work-pool inspect $$PREFECT_WORK_POOL >/dev/null 2>&1 || prefect work-pool create $$PREFECT_WORK_POOL --type process; python -m apps.g2b.pipeline.app.deployments; prefect worker start --pool $$PREFECT_WORK_POOL"]
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    restart: unless-stopped
    env_file:
      - ../../apps/g2b/pipeline/infra/env/app.env
    profiles:
      - "g2b-pipeline"
      - "g2b"
    depends_on:
      prefect-server:
        condition: service_healthy

  pubdata-mcp:
    build:
      context: ../..
      dockerfile: apps/pubdata_mcp/infra/image/Dockerfile
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    restart: unless-stopped
    env_file:
      - ../../apps/pubdata_mcp/infra/env/app.env
    ports:
      - "${HOST_BIND_IP:-127.0.0.1}:${PUBDATA_MCP_HOST_PORT:-8015}:8000"
    profiles:
      - "pubdata-mcp"
      - "pubdata"
    depends_on:
      semantic-platform-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready', timeout=2).read()"]
      interval: 10s
      timeout: 3s
      retries: 5
