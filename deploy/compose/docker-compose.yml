# Generated by scripts/generate_compose.py
# Source of truth: services/*/manifests + apps/**/manifests
name: infra
services:
  context-platform-api:
    build:
      context: ../..
      dockerfile: services/context_platform/adapters/admin_api/infra/image/Dockerfile
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    restart: unless-stopped
    env_file:
      - ./env/postgres.env
      - ./env/prefect.env
      - ../../services/context_platform/adapters/admin_api/infra/env/app.env
      - ../../services/context_platform/adapters/admin_api/infra/env/object_store.env
    profiles:
      - "context_platform"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      prefect-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready', timeout=2).read()"]
      interval: 10s
      timeout: 3s
      retries: 5

  context-platform-dashboard:
    build:
      context: ../..
      dockerfile: services/context_platform/adapters/dashboard/infra/image/Dockerfile
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    restart: unless-stopped
    profiles:
      - "context_platform"
    depends_on:
      context-platform-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/context-platform').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 5

  context-platform-planner-api:
    build:
      context: ../..
      dockerfile: services/context_platform/adapters/planner_api/infra/image/Dockerfile
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    restart: unless-stopped
    env_file:
      - ./env/postgres.env
      - ../../services/context_platform/adapters/admin_api/infra/env/app.env
    profiles:
      - "context_platform"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready', timeout=2).read()"]
      interval: 10s
      timeout: 3s
      retries: 5

  context-platform-worker:
    build:
      context: ../..
      dockerfile: services/context_platform/adapters/worker/infra/image/Dockerfile
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    restart: unless-stopped
    env_file:
      - ./env/postgres.env
      - ./env/prefect.env
      - ../../services/context_platform/adapters/worker/infra/env/app.env
      - ../../services/context_platform/adapters/admin_api/infra/env/object_store.env
    profiles:
      - "context_platform"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      prefect-server:
        condition: service_healthy

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: ["server", "/data", "--console-address", ":9001"]
    restart: unless-stopped
    env_file:
      - ./env/minio.env
    ports:
      - "${HOST_BIND_IP:-127.0.0.1}:${MINIO_API_HOST_PORT:-9000}:9000"
      - "${HOST_BIND_IP:-127.0.0.1}:${MINIO_CONSOLE_HOST_PORT:-9001}:9001"
    profiles:
      - "context_platform"
    volumes:
      - ${MINIO_DATA_DIR:-../../data/minio}:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  nginx:
    build:
      context: ../..
      dockerfile: services/nginx/infra/image/Dockerfile
    restart: unless-stopped
    ports:
      - "${NGINX_BIND_IP:-0.0.0.0}:${NGINX_HOST_PORT:-8081}:80"
    depends_on:
      platform-api:
        condition: service_healthy
      platform-dashboard:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/health/ready"]
      interval: 10s
      timeout: 3s
      retries: 5

  platform-api:
    build:
      context: ../..
      dockerfile: services/platform_api/infra/image/Dockerfile
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    restart: unless-stopped
    env_file:
      - ./env/postgres.env
      - ./env/platform_api.env
    ports:
      - "${HOST_BIND_IP:-127.0.0.1}:${API_HOST_PORT:-8000}:${API_CONTAINER_PORT:-8000}"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/live', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 10

  platform-dashboard:
    build:
      context: ../..
      dockerfile: services/platform_dashboard/infra/image/Dockerfile
    restart: unless-stopped
    ports:
      - "${HOST_BIND_IP:-127.0.0.1}:${DASHBOARD_HOST_PORT:-3001}:${DASHBOARD_CONTAINER_PORT:-80}"
    depends_on:
      platform-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 10s
      timeout: 3s
      retries: 5

  postgres:
    image: pgvector/pgvector:pg16
    command: ["postgres", "-c", "timezone=Asia/Seoul"]
    restart: unless-stopped
    env_file:
      - ./env/postgres.env
    ports:
      - "${POSTGRES_HOST_BIND_IP:-127.0.0.1}:${POSTGRES_HOST_PORT:-5433}:${POSTGRES_CONTAINER_PORT:-5432}"
    volumes:
      - ${POSTGRES_DATA_DIR:-../../data/postgres}:/var/lib/postgresql/data
      - ../../services/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 2s
      timeout: 2s
      retries: 10

  prefect-postgres:
    image: postgres:14
    restart: unless-stopped
    env_file:
      - ./env/prefect.env
    profiles:
      - "context_platform"
    volumes:
      - ${PREFECT_POSTGRES_DATA_DIR:-../../data/prefect/postgres}:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U prefect"]
      interval: 5s
      timeout: 5s
      retries: 5

  prefect-redis:
    image: redis:7
    restart: unless-stopped
    profiles:
      - "context_platform"
    volumes:
      - ${PREFECT_REDIS_DATA_DIR:-../../data/prefect/redis}:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  prefect-server:
    image: prefecthq/prefect:3-latest
    command: ["prefect", "server", "start", "--no-services"]
    restart: unless-stopped
    env_file:
      - ./env/prefect.env
    ports:
      - "${HOST_BIND_IP:-127.0.0.1}:${PREFECT_HOST_PORT:-4200}:4200"
    profiles:
      - "context_platform"
    depends_on:
      prefect-postgres:
        condition: service_healthy
      prefect-redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:4200/api/health', timeout=1)"]
      interval: 30s
      timeout: 10s
      retries: 3

  prefect-services:
    image: prefecthq/prefect:3-latest
    command: ["prefect", "server", "services", "start"]
    restart: unless-stopped
    env_file:
      - ./env/prefect.env
    profiles:
      - "context_platform"
    depends_on:
      prefect-server:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]
    ports:
      - "${HOST_BIND_IP:-127.0.0.1}:${REDIS_HOST_PORT:-6380}:${REDIS_CONTAINER_PORT:-6379}"
    volumes:
      - ../../services/redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 10

  data-score-api:
    build:
      context: ../..
      dockerfile: apps/data_score/adapters/api/infra/image/Dockerfile
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    restart: unless-stopped
    env_file:
      - ../../apps/data_score/adapters/api/infra/env/app.env
    ports:
      - "${HOST_BIND_IP:-127.0.0.1}:${DATA_SCORE_API_HOST_PORT:-8025}:8000"
    profiles:
      - "data-score"
      - "data_score"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready', timeout=2).read()"]
      interval: 10s
      timeout: 3s
      retries: 5

  data-score-dashboard:
    build:
      context: ../..
      dockerfile: apps/data_score/adapters/dashboard/infra/image/Dockerfile
    restart: unless-stopped
    env_file:
      - ../../apps/data_score/adapters/dashboard/infra/env/app.env
    ports:
      - "${HOST_BIND_IP:-127.0.0.1}:${DATA_SCORE_DASHBOARD_HOST_PORT:-3025}:3000"
    profiles:
      - "data-score"
      - "data_score"
    depends_on:
      data-score-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/"]
      interval: 10s
      timeout: 3s
      retries: 5

  data-score-worker:
    build:
      context: ../..
      dockerfile: apps/data_score/adapters/worker/infra/image/Dockerfile
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    restart: unless-stopped
    env_file:
      - ../../apps/data_score/adapters/worker/infra/env/app.env
    profiles:
      - "data-score"
      - "data_score"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  pubdata-mcp:
    build:
      context: ../..
      dockerfile: apps/pubdata_mcp/adapters/api/infra/image/Dockerfile
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    restart: unless-stopped
    env_file:
      - ../../apps/pubdata_mcp/adapters/api/infra/env/app.env
    ports:
      - "${HOST_BIND_IP:-127.0.0.1}:${PUBDATA_MCP_HOST_PORT:-8015}:8000"
    profiles:
      - "pubdata-mcp"
      - "pubdata"
    depends_on:
      context-platform-planner-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready', timeout=2).read()"]
      interval: 10s
      timeout: 3s
      retries: 5
