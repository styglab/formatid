# Generated by scripts/generate_compose.py
# Source of truth: core/**/manifests + apps/**/manifests + services/*/manifests
name: infra
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file:
      - ./env/postgres.env
    ports:
      - "${HOST_BIND_IP:-127.0.0.1}:${POSTGRES_HOST_PORT:-5432}:${POSTGRES_CONTAINER_PORT:-5432}"
    volumes:
      - ${POSTGRES_DATA_DIR:-../../data/postgres}:/var/lib/postgresql/data
      - ../../core/backing/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 2s
      timeout: 2s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]
    ports:
      - "${HOST_BIND_IP:-127.0.0.1}:${REDIS_HOST_PORT:-6379}:${REDIS_CONTAINER_PORT:-6379}"
    volumes:
      - ../../core/backing/redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 10

  nginx:
    build:
      context: ../..
      dockerfile: services/nginx/infra/image/Dockerfile
    restart: unless-stopped
    ports:
      - "${NGINX_HOST_PORT:-80}:80"
    depends_on:
      runtime-api:
        condition: service_healthy
      runtime-dashboard:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/health/ready"]
      interval: 10s
      timeout: 3s
      retries: 5

  prefect-postgres:
    image: postgres:14
    restart: unless-stopped
    env_file:
      - ./env/prefect.env
    profiles:
      - "g2b-pipeline"
      - "g2b"
    volumes:
      - ${PREFECT_POSTGRES_DATA_DIR:-../../data/prefect/postgres}:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U prefect"]
      interval: 5s
      timeout: 5s
      retries: 5

  prefect-redis:
    image: redis:7
    restart: unless-stopped
    profiles:
      - "g2b-pipeline"
      - "g2b"
    volumes:
      - ${PREFECT_REDIS_DATA_DIR:-../../data/prefect/redis}:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  prefect-server:
    image: prefecthq/prefect:3-latest
    command: ["prefect", "server", "start", "--no-services"]
    restart: unless-stopped
    env_file:
      - ./env/prefect.env
    ports:
      - "${HOST_BIND_IP:-127.0.0.1}:${PREFECT_HOST_PORT:-4200}:4200"
    profiles:
      - "g2b-pipeline"
      - "g2b"
    depends_on:
      prefect-postgres:
        condition: service_healthy
      prefect-redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:4200/api/health', timeout=1)"]
      interval: 30s
      timeout: 10s
      retries: 3

  prefect-services:
    image: prefecthq/prefect:3-latest
    command: ["prefect", "server", "services", "start"]
    restart: unless-stopped
    env_file:
      - ./env/prefect.env
    profiles:
      - "g2b-pipeline"
      - "g2b"
    depends_on:
      prefect-server:
        condition: service_healthy

  runtime-api:
    build:
      context: ../..
      dockerfile: services/runtime_api/infra/image/Dockerfile
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    restart: unless-stopped
    env_file:
      - ./env/postgres.env
      - ./env/runtime_api.env
    ports:
      - "${HOST_BIND_IP:-127.0.0.1}:${API_HOST_PORT:-8000}:${API_CONTAINER_PORT:-8000}"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/live', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 10

  runtime-dashboard:
    build:
      context: ../..
      dockerfile: services/runtime_dashboard/infra/image/Dockerfile
    restart: unless-stopped
    ports:
      - "${HOST_BIND_IP:-127.0.0.1}:${DASHBOARD_HOST_PORT:-8080}:${DASHBOARD_CONTAINER_PORT:-80}"
    depends_on:
      runtime-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 10s
      timeout: 3s
      retries: 5

  g2b-mcp:
    build:
      context: ../..
      dockerfile: apps/g2b_mcp/infra/image/Dockerfile
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    restart: unless-stopped
    env_file:
      - ../../apps/g2b_mcp/infra/env/app.env
    ports:
      - "${HOST_BIND_IP:-127.0.0.1}:${G2B_MCP_HOST_PORT:-8013}:8000"
    profiles:
      - "g2b-mcp"
      - "g2b"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready', timeout=2).read()"]
      interval: 10s
      timeout: 3s
      retries: 5

  g2b-pipeline-worker:
    build:
      context: ../..
      dockerfile: apps/g2b_pipeline/infra/image/Dockerfile
    command: ["sh", "-c", "prefect work-pool inspect $$PREFECT_WORK_POOL >/dev/null 2>&1 || prefect work-pool create $$PREFECT_WORK_POOL --type process; python -m apps.g2b_pipeline.app.deployments; prefect worker start --pool $$PREFECT_WORK_POOL"]
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    restart: unless-stopped
    env_file:
      - ../../apps/g2b_pipeline/infra/env/app.env
    profiles:
      - "g2b-pipeline"
      - "g2b"
    depends_on:
      prefect-server:
        condition: service_healthy
