location = /g2b-mcp {
    return 302 /g2b-mcp/;
}

location /g2b-mcp/ {
    set $g2b_mcp_upstream http://g2b-mcp:8000;
    rewrite ^/g2b\-mcp/(.*)$ /$1 break;
    proxy_pass $g2b_mcp_upstream;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
}
