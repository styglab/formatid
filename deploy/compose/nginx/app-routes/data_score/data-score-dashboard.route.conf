location = /data-score-dashboard {
    set $data_score_dashboard_upstream http://data-score-dashboard:3000;
    proxy_pass $data_score_dashboard_upstream;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
}

location /data-score-dashboard/ {
    set $data_score_dashboard_upstream http://data-score-dashboard:3000;
    proxy_pass $data_score_dashboard_upstream;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
}
