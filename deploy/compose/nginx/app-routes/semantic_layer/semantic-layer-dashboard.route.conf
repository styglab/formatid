location = /semantic-layer-dashboard {
    set $semantic_layer_dashboard_upstream http://semantic-layer-dashboard:3000;
    proxy_pass $semantic_layer_dashboard_upstream;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
}

location /semantic-layer-dashboard/ {
    set $semantic_layer_dashboard_upstream http://semantic-layer-dashboard:3000;
    proxy_pass $semantic_layer_dashboard_upstream;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
}
