location = /semantic-layer {
    return 302 /semantic-layer/;
}

location /semantic-layer/ {
    set $semantic_layer_api_upstream http://semantic-layer-api:8000;
    rewrite ^/semantic\-layer/(.*)$ /$1 break;
    proxy_pass $semantic_layer_api_upstream;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
}
