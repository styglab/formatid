location = /context-platform-planner {
    return 302 /context-platform-planner/;
}

location /context-platform-planner/ {
    set $context_platform_planner_api_upstream http://context-platform-planner-api:8000;
    rewrite ^/context\-platform\-planner/(.*)$ /$1 break;
    proxy_pass $context_platform_planner_api_upstream;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
}
