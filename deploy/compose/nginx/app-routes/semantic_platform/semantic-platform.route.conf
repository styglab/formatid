location = /semantic-platform {
    return 302 /semantic-platform/;
}

location /semantic-platform/ {
    set $semantic_platform_api_upstream http://semantic-platform-api:8000;
    rewrite ^/semantic\-platform/(.*)$ /$1 break;
    proxy_pass $semantic_platform_api_upstream;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
}
