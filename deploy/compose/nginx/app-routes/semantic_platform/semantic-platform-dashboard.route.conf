location = /semantic-platform-dashboard {
    return 302 /semantic-platform-dashboard/;
}

location /semantic-platform-dashboard/ {
    set $semantic_platform_dashboard_upstream http://semantic-platform-dashboard:80;
    rewrite ^/semantic\-platform\-dashboard/(.*)$ /$1 break;
    proxy_pass $semantic_platform_dashboard_upstream;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
}
