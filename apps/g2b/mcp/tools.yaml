name: g2b-mcp
title: G2B MCP
description: G2B procurement MCP tools.
tools:
  - name: search_bid
    description: >
      Search G2B bid notices. Use published_from/to for posted notice date,
      deadline_from/to for bid deadline, and opening_from/to for opening date.
    handler: apps.g2b.domain.procurement.repository.search_bids
    input:
      fields:
        category:
          type: string
          description: SERVICE, GOODS, CONSTRUCTION, or FOREIGN.
        keyword:
          type: string
        notice_kind:
          type: string
        exclude_cancelled:
          type: boolean
          default: true
        contract_method:
          type: string
        bid_method:
          type: string
        bid_notice_no:
          type: string
        bid_notice_order:
          type: string
        published_from:
          type: string
        published_to:
          type: string
        deadline_from:
          type: string
        deadline_to:
          type: string
        opening_from:
          type: string
        opening_to:
          type: string
        notice_agency_name:
          type: string
        demand_agency_name:
          type: string
        has_budget:
          type: boolean
        min_budget:
          type: integer
        max_budget:
          type: integer
        limit:
          type: integer
          default: 10
        offset:
          type: integer
          default: 0
        sort_by:
          type: string
          default: published_at
        sort_order:
          type: string
          default: desc
        include_license_limits:
          type: boolean
          default: false
        include_participation_regions:
          type: boolean
          default: false
        include_success_bids:
          type: boolean
          default: false
        include_semantic:
          type: boolean
          default: false
        semantic_tags:
          type: array
        requires_license:
          type: string
        restricted_region:
          type: string
    semantics:
      returns: BidNotice
      default_sort: published_at desc
      date_semantics:
        posted_notice: published_at
        deadline: deadline_at
        opening: opening_at
    evidence:
      tables:
        - g2b.bid_public_notice

  - name: search_success_bid
    description: >
      Search G2B successful bid results. Use final_success_from/to for award date;
      registered_from/to is API record registration date.
    handler: apps.g2b.domain.procurement.repository.search_success_bids
    input:
      fields:
        category:
          type: string
        keyword:
          type: string
        bid_notice_no:
          type: string
        bid_notice_order:
          type: string
        winner_name:
          type: string
        winner_business_no:
          type: string
        demand_org_name:
          type: string
        registered_from:
          type: string
        registered_to:
          type: string
        final_success_from:
          type: string
        final_success_to:
          type: string
        min_winning_amount:
          type: integer
        max_winning_amount:
          type: integer
        limit:
          type: integer
          default: 10
        offset:
          type: integer
          default: 0
        sort_by:
          type: string
          default: registered_at
        sort_order:
          type: string
          default: desc
        include_semantic:
          type: boolean
          default: false
    semantics:
      returns: SuccessfulBid
      default_sort: registered_at desc
      date_semantics:
        award_date: final_success_date
        registration_date: registered_at
    evidence:
      tables:
        - g2b.successful_bid

  - name: search_contract
    description: >
      Search G2B contracts. Use contract_date_from/to for questions like
      "today's contracts"; registered_from/to is only API record registration date.
    handler: apps.g2b.domain.procurement.repository.search_contracts
    input:
      fields:
        category:
          type: string
        keyword:
          type: string
        unified_contract_no:
          type: string
        bid_notice_no:
          type: string
        contract_org_name:
          type: string
        company_name:
          type: string
        business_no:
          type: string
        registered_from:
          type: string
        registered_to:
          type: string
        contract_date_from:
          type: string
        contract_date_to:
          type: string
        contract_concluded_from:
          type: string
        contract_concluded_to:
          type: string
        min_amount:
          type: integer
        max_amount:
          type: integer
        limit:
          type: integer
          default: 10
        offset:
          type: integer
          default: 0
        sort_by:
          type: string
          default: contract_date
        sort_order:
          type: string
          default: desc
        include_companies:
          type: boolean
          default: false
        include_demand_organizations:
          type: boolean
          default: false
        include_semantic:
          type: boolean
          default: false
    semantics:
      returns: Contract
      default_sort: contract_date desc
      date_semantics:
        contract_date: contract_date
        conclusion_date: contract_concluded_date
        registration_date: registered_at
    evidence:
      tables:
        - g2b.contract
        - g2b.contract_company

  - name: get_bid_context
    description: Return one semantic-aware bid context object for an exact bid notice.
    handler: apps.g2b.domain.procurement.repository.summarize_bid_context
    input:
      required:
        - bid_notice_no
      fields:
        bid_notice_no:
          type: string
        bid_notice_order:
          type: string
        category:
          type: string
    semantics:
      returns: BidNotice
    evidence:
      tables:
        - g2b.bid_public_notice
        - g2b.bid_public_notice_license_limit
        - g2b.bid_public_notice_participation_region

  - name: get_procurement_lifecycle
    description: >
      Return bid notice, constraints, award results, contracts, companies, and
      demand organizations linked by bid_notice_no.
    handler: apps.g2b.domain.procurement.repository.get_procurement_lifecycle
    input:
      required:
        - bid_notice_no
      fields:
        bid_notice_no:
          type: string
        bid_notice_order:
          type: string
        category:
          type: string
    semantics:
      returns: ProcurementLifecycle
    evidence:
      tables:
        - g2b.bid_public_notice
        - g2b.successful_bid
        - g2b.contract
        - g2b.contract_company
        - g2b.contract_demand_organization

  - name: get_tool_capabilities
    description: Return semantic model, vocabulary, date semantics, and MCP tool capability metadata.
    handler: apps.g2b.domain.procurement.repository.get_tool_capabilities
    input:
      fields: {}
    semantics:
      returns: ToolCapabilities
