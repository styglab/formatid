tools:
  - name: semantic_query
    description: Plan a natural-language public-data question as a provider-neutral semantic execution DAG and optionally execute mapped provider tools.
    handler: apps.pubdata_mcp.app.common.catalog.semantic_query
    input:
      required:
        - query
      fields:
        query:
          type: string
          description: Natural language question, such as 300억 이상 기업들의 조달 참여 규모.
        limit:
          type: integer
          description: Maximum semantic items and capability nodes to consider.
          default: 8
        execute:
          type: boolean
          description: Execute DAG nodes when semantic arguments can be mapped to registered provider tools.
          default: false
        manual_plan:
          type: object
          description: Explicit execution-plan LLM response payload used only when LLM_MODE=codex_manual.

  - name: semantic_smoke_test_operation
    description: Execute one approved semantic operation contract or operation variant with sample semantic arguments and store the endpoint check result in semantic_layer.
    handler: apps.pubdata_mcp.app.common.catalog.semantic_smoke_test_operation
    input:
      required: []
      fields:
        operation_id:
          type: string
          description: Approved operation_id from semantic_layer operation contracts. Optional when variant_id is provided.
        variant_id:
          type: string
          description: Approved operation_variant id. Use this for capability-specific checks when one endpoint has multiple semantic capabilities or control values.
        semantic_arguments:
          type: object
          description: Semantic arguments used for the smoke test.
          default: {}
        persist:
          type: boolean
          description: Store the check result in semantic_layer.
          default: true
