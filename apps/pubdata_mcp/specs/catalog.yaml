tools:
  - name: plan_request
    description: Ask the server-side Planner Service to create and validate a canonical capability plan.
    handler: apps.pubdata_mcp.domain.catalog.plan_request
    input:
      required:
        - query
      fields:
        query:
          type: string
          description: Natural-language user request.
        canonical_inputs:
          type: object
          description: Optional canonical input values already known by the LLM client.
          default: {}
        limit:
          type: integer
          description: Maximum planner candidates to consider.
          default: 8

  - name: execute_plan
    description: Execute a validated Planner Service plan by plan id.
    handler: apps.pubdata_mcp.domain.catalog.execute_plan
    input:
      required:
        - plan_id
      fields:
        plan_id:
          type: string
          description: Planner Service plan id returned by plan_request.

  - name: explain_plan
    description: Return structured plan details suitable for LLM explanation.
    handler: apps.pubdata_mcp.domain.catalog.explain_plan
    input:
      required: []
      fields:
        plan_id:
          type: string
          description: Planner Service plan id.
        plan:
          type: object
          description: Inline plan payload to explain.
          default: {}

  - name: search_capabilities
    description: Developer/debug read tool for approved planner-facing capabilities.
    handler: apps.pubdata_mcp.domain.catalog.search_capabilities
    input:
      required: []
      fields:
        query:
          type: string
          description: Optional capability search text.
          default: ""
        status:
          type: string
          description: Capability lifecycle status to read.
          default: approved

  - name: get_capability
    description: Developer/debug read tool for one capability.
    handler: apps.pubdata_mcp.domain.catalog.get_capability
    input:
      required:
        - capability_id
      fields:
        capability_id:
          type: string
          description: Capability id.

  - name: get_canonical_model
    description: Developer/debug read tool for canonical entities and attributes.
    handler: apps.pubdata_mcp.domain.catalog.get_canonical_model
    input:
      required: []
      fields: {}

  - name: get_operation_bindings
    description: Developer/debug read tool for source operation bindings.
    handler: apps.pubdata_mcp.domain.catalog.get_operation_bindings
    input:
      required:
        - source_operation_id
      fields:
        source_operation_id:
          type: string
          description: Source operation id selected by Planner Service.
