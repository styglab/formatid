name: nts
title: NTS Business Registration API
description: National Tax Service business registration status and validation APIs.
tools:
  - name: check_nts_business_status_live
    description: >
      Check Korean business registration status by calling the NTS public API
      directly. Use this when only a business registration number is available.
      Accepts up to 100 business numbers per call.
    handler: apps.pubdata_mcp.app.providers.nts.tools.check_business_status
    input:
      required:
        - business_numbers
      fields:
        business_numbers:
          type: array
          description: List of 10-digit Korean business registration numbers. Hyphens are accepted and stripped.
    semantics:
      returns: RawNTSBusinessStatusPage
    response:
      item:
        keep_raw: true
        normalized:
          business_no:
            catalog_field: business_no
            path: b_no
            type: string
          tax_type:
            catalog_field: tax_type
            path: tax_type
            type: string
          tax_type_code:
            path: tax_type_cd
            type: string
          business_status:
            catalog_field: business_status
            path: b_stt
            type: string
          business_status_code:
            path: b_stt_cd
            type: string
          end_date:
            path: end_dt
            type: date
          invoice_apply_date:
            path: invoice_apply_dt
            type: date
          unit_tax_conversion:
            path: utcc_yn
            type: string
          tax_type_change_date:
            path: tax_type_change_dt
            type: date
          previous_tax_type:
            path: rbf_tax_type
            type: string
          previous_tax_type_code:
            path: rbf_tax_type_cd
            type: string
    evidence:
      source: NTS business registration API
      storage: none
      api_method: status

  - name: validate_nts_business_registration_live
    description: >
      Validate Korean business registration details by calling the NTS public API
      directly. Use this when business number, owner name, and opening date are
      known. Optional fields can improve matching accuracy. Accepts up to 100
      records per call.
    handler: apps.pubdata_mcp.app.providers.nts.tools.validate_business_registration
    input:
      required:
        - businesses
      fields:
        businesses:
          type: array
          description: >
            List of validation records. Each record requires b_no or business_no,
            start_dt or start_date, and p_nm or owner_name. Optional fields:
            p_nm2, b_nm/company_name, corp_no/corporation_no, b_sector,
            b_type, b_adr/business_address.
    semantics:
      returns: RawNTSBusinessValidationPage
    response:
      item:
        keep_raw: true
        normalized:
          business_no:
            catalog_field: business_no
            path: b_no
            type: string
          valid:
            path: valid
            type: string
          valid_message:
            path: valid_msg
            type: string
          tax_type:
            catalog_field: tax_type
            path: tax_type
            type: string
          tax_type_code:
            path: tax_type_cd
            type: string
          business_status:
            catalog_field: business_status
            path: b_stt
            type: string
          business_status_code:
            path: b_stt_cd
            type: string
          end_date:
            path: end_dt
            type: date
          invoice_apply_date:
            path: invoice_apply_dt
            type: date
          unit_tax_conversion:
            path: utcc_yn
            type: string
          tax_type_change_date:
            path: tax_type_change_dt
            type: date
          previous_tax_type:
            path: rbf_tax_type
            type: string
          previous_tax_type_code:
            path: rbf_tax_type_cd
            type: string
    evidence:
      source: NTS business registration API
      storage: none
      api_method: validate
