<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Data Score</title>
    <style>
      :root {
        color-scheme: light;
        font-family: "Iowan Old Style", "Palatino Linotype", "Book Antiqua", serif;
        background: #f4efe6;
        color: #1d1a16;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background:
          radial-gradient(circle at top left, rgba(201, 111, 52, 0.18), transparent 28%),
          radial-gradient(circle at bottom right, rgba(29, 91, 69, 0.12), transparent 24%),
          #f4efe6;
      }
      main {
        width: min(760px, calc(100vw - 48px));
        padding: 32px;
        border: 1px solid rgba(29, 26, 22, 0.12);
        background: rgba(255, 252, 247, 0.88);
      }
      h1 {
        margin: 0 0 12px;
        font-size: 40px;
        line-height: 1.05;
      }
      p {
        margin: 0;
        font-size: 18px;
        line-height: 1.5;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Data Score</h1>
      <p>Dashboard scaffold for AI-native data quality evaluation.</p>
    </main>
  </body>
</html>
