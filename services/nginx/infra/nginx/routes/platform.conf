location /api/ {
    rewrite ^/api/(.*)$ /$1 break;
    proxy_pass $platform_api_upstream;
    proxy_read_timeout 120s;
}

location = /openapi.json {
    proxy_pass $platform_api_upstream;
    proxy_read_timeout 120s;
}

location = /docs/oauth2-redirect {
    proxy_pass $platform_api_upstream;
    proxy_read_timeout 120s;
}

location = /dashboard {
    return 302 /dashboard/;
}

location /dashboard/ {
    rewrite ^/dashboard/(.*)$ /$1 break;
    proxy_pass $platform_dashboard_upstream;
    proxy_read_timeout 120s;
}

location = /app.js {
    proxy_pass $platform_dashboard_upstream;
    proxy_read_timeout 120s;
}

location = /styles.css {
    proxy_pass $platform_dashboard_upstream;
    proxy_read_timeout 120s;
}
