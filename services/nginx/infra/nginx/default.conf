map $http_upgrade $connection_upgrade {
    default upgrade;
    "" close;
}

server {
    listen 80;
    server_name _;
    absolute_redirect off;

    resolver 127.0.0.11 valid=10s ipv6=off;
    set $prefect_upstream http://prefect-server:4200;
    set $runtime_api_upstream http://runtime-api:8000;
    set $runtime_dashboard_upstream http://runtime-dashboard:80;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;

    location = /health/ready {
        access_log off;
        return 200 "ready\n";
    }

    include /etc/nginx/routes/*.conf;
    include /etc/nginx/app-routes/*/*.route.conf;

    location / {
        return 302 /dashboard/;
    }
}
