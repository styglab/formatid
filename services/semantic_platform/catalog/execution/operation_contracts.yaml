operation_contracts:

  nts.business_registration.status:
    capability: check_business_status
    resource_id: nts.business_registration
    provider: nts
    method: POST
    path: /status
    auth:
      type: service_key
      parameter: serviceKey
      in: query
    request:
      body:
        b_no:
          semantic_type: business_registration_number
          required: true
          collection: true
    response:
      items_path: data
      fields:
        b_no: business_registration_number
        b_stt: business_status
        b_stt_cd: business_status
        tax_type: tax_type
        tax_type_cd: tax_type

  nts.business_registration.validate:
    capability: validate_business_registration
    resource_id: nts.business_registration
    provider: nts
    method: POST
    path: /validate
    auth:
      type: service_key
      parameter: serviceKey
      in: query
    request:
      body:
        b_no:
          semantic_type: business_registration_number
          required: true
        p_nm:
          semantic_type: representative_name
          required: true
        start_dt:
          semantic_type: business_open_date
          required: true
        b_nm:
          semantic_type: organization_name
        corp_no:
          semantic_type: corporation_number
        b_adr:
          semantic_type: business_address
    response:
      items_path: data
      fields:
        valid: valid_status
        valid_msg: result_message

  pps.contract_info.getCntrctInfoListThng:
    capability: search_procurement_contracts
    resource_id: pps.contract_info
    provider: pps
    method: GET
    path: /getCntrctInfoListThngPPSSrch
    selectors:
      procurement_category: [물품, GOODS]
    auth:
      type: service_key
      parameter: serviceKey
      in: query
    request:
      query:
        inqryDiv:
          kind: control
          semantic_type: inquiry_basis
          required: true
          planner_selects: true
          enum_mapping:
            contract_date: "1"
          enum:
            -
              semantic_value: contract_date
              value: "1"
              meaning_ko: "계약일자 기준 조회"
        inqryBgnDate:
          semantic_type: contract_date
          transform: date_start
          required: true
        inqryEndDate:
          semantic_type: contract_date
          transform: date_end
          required: true
        pageNo:
          semantic_type: page_number
          default: 1
        numOfRows:
          semantic_type: page_size
          default: 10
    response:
      items_path: response.body.items.item
      fields:
        untyCntrctNo: contract_id
        dcsnCntrctNo: confirmed_contract_number
        cntrctNm: contract_name
        bsnsDivNm: procurement_category
        totCntrctAmt: contract_amount
        thtmCntrctAmt: contract_amount
        cntrctDate: contract_date
        cntrctCnclsDate: contract_date
        cntrctInsttCd: organization_code
        cntrctInsttNm: organization_name
      extractors:
        corpList:
          parser: pps_contract_companies
          produces:
            company_name: organization_name
            business_no: business_registration_number

